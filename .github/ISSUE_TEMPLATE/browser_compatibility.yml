name: Browser compatibility
description: Report browser-specific camera or recording behavior
title: '[Browser]: '
labels: ['browser compatibility']
body:
  - type: dropdown
    id: feature
    attributes:
      label: Feature
      options:
        - Webcam preview
        - Screenshot capture
        - Video recording
        - Device switching
        - Facing mode switching
        - Torch/zoom/advanced constraints
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code
      render: tsx
