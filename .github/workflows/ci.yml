name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify package
        run: npm run verify

      - name: Audit dependencies
        run: npm run audit

      - name: Build camera recorder example
        working-directory: examples/camera-recorder
        run: |
          npm install --package-lock=false
          npm run build

  react-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react:
          - version: 18.3.1
            types: 18.3.31
            dom-types: 18.3.7
          - version: 19.1.0
            types: 19.1.8
            dom-types: 19.1.6
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install React ${{ matrix.react.version }}
        run: |
          npm install --no-save --package-lock=false \
            react@${{ matrix.react.version }} \
            react-dom@${{ matrix.react.version }} \
            @types/react@${{ matrix.react.types }} \
            @types/react-dom@${{ matrix.react.dom-types }}

      - name: Typecheck and test
        run: npm run typecheck && npm run test && npm run build && npm run test:types

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - camera-recorder
          - vite-starter
          - next-app-router
          - react-router
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Install example dependencies
        working-directory: examples/${{ matrix.example }}
        run: npm install --package-lock=false

      - name: Build example
        working-directory: examples/${{ matrix.example }}
        run: npm run build
